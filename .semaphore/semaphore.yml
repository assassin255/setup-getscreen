version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: 'Block #1'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - 'version: v1.0'
            - 'name: Full-QEMU + Pinggy 2-min Timeout'
            - 'execution_time_limit:'
            - '  minutes: 2   # Hết 2 phút là cancel cả job'
            - 'agent:'
            - '  machine:'
            - '    type: e2-standard-4'
            - '    os_image: ubuntu2204'
            - 'blocks:'
            - '  - name: Setup & Run QEMU + Pinggy'
            - '    task:'
            - '      jobs:'
            - '        - name: Full VM + Pinggy (2 min)'
            - '          commands:'
            - '            - sudo apt-get update -y'
            - '            - sudo apt-get install -y qemu-kvm qemu-utils wget curl'
            - '            - wget -O win.iso "https://archive.org/download/windows-10-lite-edition-19h2-x64/Windows%2010%20Lite%20Edition%2019H2%20x64.iso"'
            - '            - wget -O virtio.iso "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.271-1/virtio-win-0.1.271.iso"'
            - '            - qemu-img create -f qcow2 nvme_disk.qcow2 50G'
            - '            - bash -c '''
            - '                sudo qemu-system-x86_64 \'
            - '                  -accel kvm \'
            - '                  -cpu host,+kvm_pv_unhalt,+npt \'
            - '                  -smp sockets=1,cores=4,threads=1 \'
            - '                  -m 14G \'
            - '                  -object memory-backend-ram,id=mem0,size=7G,prealloc=on \'
            - '                  -object memory-backend-ram,id=mem1,size=7G,prealloc=on \'
            - '                  -numa node,memdev=mem0,cpus=0-1,nodeid=0 \'
            - '                  -numa node,memdev=mem1,cpus=2-3,nodeid=1 \'
            - '                  -drive file=win.iso,media=cdrom,if=none,id=cd_win \'
            - '                  -device ide-cd,drive=cd_win,bus=ide.0 \'
            - '                  -drive file=virtio.iso,media=cdrom,if=none,id=cd_virtio \'
            - '                  -device ide-cd,drive=cd_virtio,bus=ide.1 \'
            - '                  -drive file=nvme_disk.qcow2,if=none,id=drive,format=qcow2,cache=unsafe,discard=unmap,aio=threads \'
            - '                  -device virtio-blk-pci,drive=drive \'
            - '                  -device virtio-net-pci,netdev=n0,mq=on \'
            - '                  -netdev user,id=n0,hostfwd=tcp::3389-:3389 \'
            - '                  -device virtio-gpu-pci -vga virtio \'
            - '                  -device qemu-xhci,id=xhci \'
            - '                  -device usb-tablet \'
            - '                  -boot order=d,menu=on \'
            - '                  -vnc :0 \'
            - '                  -rtc base=localtime,clock=host,driftfix=slew \'
            - '                  -no-user-config -nodefaults \'
            - '                  -daemonize &'
            - '                QEMU_PID=$!'
            - '                nohup ssh -p 443 -R0:localhost:5900 -o StrictHostKeyChecking=no -o BatchMode=yes -o ServerAliveInterval=30 lVuaQjAzw82+tcp@free.pinggy.io &'
            - '                wait $QEMU_PID'
            - '              '''
  - name: 'Block #2'
    task:
      jobs:
        - name: 'Job #1'
          commands: []
